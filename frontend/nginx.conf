server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa BrowserRouter (rutas como /explorar/12, sin #):
    # cualquier ruta que no sea un archivo real cae en index.html, y ahí
    # React Router decide qué pantalla mostrar. Sin esto, recargar la
    # página en /explorar/12 daría 404 directo desde nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (assets/index-XXXX.js) no
    # cambian de contenido una vez compilados: se pueden cachear fuerte.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
